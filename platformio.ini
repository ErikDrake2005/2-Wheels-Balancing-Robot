; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lolin_s3_mini]
; Tối ưu M3: ghi nhận phiên bản platform đã kiểm chứng trong cache máy:
; pioarduino/platform-espressif32 55.03.39 (Arduino 3.3.9 / ESP-IDF 5.5.4).
; Cấu hình mặc định lấy theo CAU_HINH_PHAN_CUNG_DONG_CO trong include/config/MotorConfig.h (MKS hoặc TMC_MT).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test_uart_mks.cpp>
build_flags =
    -Iinclude
    -Isrc

[env:lolin_s3_mini_tmc_mt]
; Môi trường biên dịch nhanh cho phần cứng TMC2209 + MT6701 (không cần sửa MotorConfig.h).
extends = env:lolin_s3_mini
build_src_filter = +<*> -<test_uart_mks.cpp>
build_flags =
    -Iinclude
    -Isrc
    -DCAU_HINH_PHAN_CUNG_DONG_CO=LoaiPhanCungDongCo::TMC_MT

[env:lolin_s3_mini_lsm6dsv]
; LSM6DSV / LSM6DSV16BX SPI: SCK11 MOSI10 MISO9 CS8 INT7, transmission/MKS independent.
extends = env:lolin_s3_mini
build_flags =
    -Iinclude
    -Isrc
    -DCAU_HINH_IMU=IMU_LSM6DSV_SPI

[env:lolin_s3_mini_mpu6050]
; MPU6050 I2C: SDA10 SCL11 AD0=IO7(LOW->0x68) INT=trong(poll 200Hz), Biquad khử rung + SISO Yaw.
extends = env:lolin_s3_mini
build_flags =
    -Iinclude
    -Isrc
    -DCAU_HINH_IMU=IMU_MPU6050_I2C

[env:test_uart_mks]
; Môi trường kiểm tra độc lập giao tiếp UART đọc từ kế MKS Servo42C V1.1 (GPIO1 TX, GPIO3 RX1, GPIO4 RX2)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<test_uart_mks.cpp>


